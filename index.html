<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo & Carrito de Compras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        .contenedor-principal {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .contenedor-principal {
                grid-template-columns: 1fr;
            }
        }

        .seccion-catalogo, .seccion-carrito {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .producto-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .producto-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .producto-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .producto-card .precio {
            font-weight: bold;
            color: #4ade80;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .btn-agregar {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn-agregar:hover {
            background-color: #0369a1;
        }

        .item-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .btn-qty {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
        }

        .footer-carrito {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #334155;
        }

        #total {
            font-size: 1.3rem;
            color: #4ade80;
            text-align: right;
        }
    </style>
</head>
<body>

    <main class="contenedor-principal">
        <section class="seccion-catalogo">
            <h2>Catálogo de Productos</h2>
            <div id="contenedor-productos" class="grid-productos"></div>
        </section>

        <aside class="seccion-carrito">
            <h2>Carrito de Compras</h2>
            <div id="lista-carrito"></div>
            <div class="footer-carrito">
                <h3 id="total">Total: $0</h3>
            </div>
        </aside>
    </main>

    <script>
       const productos = [
            { 
                id: 1, 
                nombre: "Lomito Completo Cordobés", 
                precio: 8500, 
                imagen: "https://cdn.pixabay.com/photo/2017/12/09/08/18/sandwich-3007382_640.jpg" 
            },
            { 
                id: 2, 
                nombre: "Empanada Criolla (Unidad)", 
                precio: 1100, 
                imagen: "https://cdn.pixabay.com/photo/2019/04/02/16/11/empanadas-4098072_640.jpg" 
            },
            { 
                id: 3, 
                nombre: "Pizza Especial de la Casa", 
                precio: 9800, 
                imagen: "https://cdn.pixabay.com/photo/2017/12/09/08/18/pizza-3007395_640.jpg" 
            },
            { 
                id: 4, 
                nombre: "Hamburguesa Doble con Queso", 
                precio: 7900, 
                imagen: "https://cdn.pixabay.com/photo/2016/03/05/19/02/hamburger-1238246_640.jpg" 
            },
            { 
                id: 5, 
                nombre: "Papas Cheddar y Bacon", 
                precio: 4500, 
                imagen: "https://cdn.pixabay.com/photo/2016/11/20/09/06/bowl-1842294_640.jpg" 
            },
            { 
                id: 6, 
                nombre: "Cerveza Artesanal IPA 500ml", 
                precio: 3200, 
                imagen: "https://cdn.pixabay.com/photo/2016/12/20/21/43/beer-1921603_640.jpg" 
            },
            { 
                id: 7, 
                nombre: "Fernet preparado 750ml", 
                precio: 4200, 
                imagen: "https://cdn.pixabay.com/photo/2017/08/03/21/37/drink-2578446_640.jpg" 
            },
            { 
                id: 8, 
                nombre: "Gaseosa Cola 500ml", 
                precio: 1800, 
                imagen: "https://cdn.pixabay.com/photo/2014/09/26/19/51/drink-462776_640.jpg" 
            }
        ];

        let carrito = [];
        let medioPagoSeleccionado = "Mercado Pago";
        const NUMERO_WHATSAPP = "5493510000000";

        const contenedorProductos = document.getElementById("contenedor-productos");
        const listaCarrito = document.getElementById("lista-carrito");
        const elementoTotal = document.getElementById("total");

        function renderizarProductos() {
            if (!contenedorProductos) return;
            contenedorProductos.innerHTML = "";
            productos.forEach(producto => {
                const tarjeta = document.createElement("div");
                tarjeta.classList.add("producto-card");
                tarjeta.innerHTML = `
                    <img src="${producto.imagen}" alt="${producto.nombre}">
                    <h3>${producto.nombre}</h3>
                    <p class="precio">$${producto.precio.toLocaleString('es-AR')}</p>
                    <button class="btn-agregar" onclick="agregarAlCarrito(${producto.id})">Agregar al Carrito</button>
                `;
                contenedorProductos.appendChild(tarjeta);
            });
        }

        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const item = carrito.find(p => p.id === id);

            if (item) {
                item.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            renderizarCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(p => p.id === id);
            if (!item) return;

            item.cantidad += cambio;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(p => p.id !== id);
            }
            renderizarCarrito();
        }

        function seleccionarMedioPago(metodo) {
            medioPagoSeleccionado = metodo;
        }

        function renderizarCarrito() {
            if (!listaCarrito) return;
            listaCarrito.innerHTML = "";

            if (carrito.length === 0) {
                listaCarrito.innerHTML = "<p style='color:#94a3b8; padding: 10px 0;'>El carrito está vacío.</p>";
                if (elementoTotal) elementoTotal.innerText = "Total: $0";
                return;
            }

            let totalCalculado = 0;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                totalCalculado += subtotal;

                const divItem = document.createElement("div");
                divItem.classList.add("item-carrito");
                divItem.innerHTML = `
                    <div>
                        <strong>${item.nombre}</strong>
                        <span style="color:#94a3b8; font-size:0.85rem; display:block;">$${item.precio.toLocaleString('es-AR')} c/u</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="btn-qty" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="btn-qty" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        <strong style="margin-left:8px;">$${subtotal.toLocaleString('es-AR')}</strong>
                    </div>
                `;
                listaCarrito.appendChild(divItem);
            });

            if (elementoTotal) {
                elementoTotal.innerText = `Total: $${totalCalculado.toLocaleString('es-AR')}`;
            }

            const divPago = document.createElement("div");
            divPago.style.cssText = "margin-top:15px; padding-top:10px; border-top:1px solid #334155;";
            divPago.innerHTML = `
                <h4 style="margin-bottom:8px; color:#cbd5e1;">Medio de Pago:</h4>
                <label style="display:block; margin-bottom:6px; cursor:pointer;">
                    <input type="radio" name="pago" value="Mercado Pago" checked onclick="seleccionarMedioPago('Mercado Pago')"> Mercado Pago / Transferencia
                </label>
                <label style="display:block; margin-bottom:15px; cursor:pointer;">
                    <input type="radio" name="pago" value="Efectivo" onclick="seleccionarMedioPago('Efectivo')"> Efectivo
                </label>
            `;
            listaCarrito.appendChild(divPago);

            const btnPagar = document.createElement("button");
            btnPagar.style.cssText = "display:block; width:100%; background:#22c55e; color:white; padding:12px; border-radius:8px; font-weight:bold; font-size:1rem; border:none; cursor:pointer; margin-top:10px;";
            btnPagar.innerText = "PAGAR Y ENVIAR PEDIDO 📲";
            btnPagar.onclick = enviarPedidoWhatsApp;

            listaCarrito.appendChild(btnPagar);
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return;

            let total = 0;
            let mensaje = "¡Hola! Quisiera realizar el siguiente pedido:%0A%0A";

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `• ${item.cantidad}x ${item.nombre} = $${subtotal.toLocaleString('es-AR')}%0A`;
            });

            mensaje += `%0A*Total a Pagar:* $${total.toLocaleString('es-AR')}`;
            mensaje += `%0A*Medio de Pago:* ${medioPagoSeleccionado}`;

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;
            window.open(url, "_blank");
        }

        renderizarProductos();
    </script>
</body>
</html>
