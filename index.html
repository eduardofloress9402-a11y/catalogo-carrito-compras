<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo & Carrito de Compras</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>

  <header>
    <h1>Mi Tienda en Línea</h1>
  </header>

  <main class="container">
    <section class="productos-seccion">
      <h2>Catálogo de Productos</h2>
      <div id="contenedor-productos" class="grid-productos">
        <!-- Se cargan dinámicamente -->
      </div>
    </section>

    <section class="carrito-seccion">
      <h2>Carrito de Compras</h2>
      <div id="lista-carrito">
        <!-- Ítems del carrito -->
      </div>
      <div class="total-contenedor">
        Total: $<span id="precio-total">0</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
