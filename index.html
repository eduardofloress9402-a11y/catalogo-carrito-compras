<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo & Carrito de Compras</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Mi Tienda Web</h1>
    <div class="cart-status">
      🛒 Carrito: <span id="cart-count">0</span> productos | Total: $<span id="cart-total">0</span>
    </div>
  </header>

  <main class="container">
    <section class="products-grid" id="products-container">
      <!-- Los productos se cargan dinámicamente desde JS -->
    </section>

    <aside class="cart-panel">
      <h2>Tu Carrito</h2>
      <ul id="cart-items"></ul>
      <button id="clear-cart" class="btn-danger">Vaciar Carrito</button>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
